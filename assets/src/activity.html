<!doctype html>
<!--
  Source for assets/activity-light.png and assets/activity-dark.png -- "sheet 2".
  Render with: node assets/src/render-activity.mjs --data=<contributions.json>

  Deliberately not a GitHub-green heatmap. Same graph paper, same tokens, same
  title block as the banner, so the two images read as pages of one drawing set.
  The single busiest day is drawn in the accent, the way jameskrape.com
  highlights one dot in its posts chart.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400..900&family=Overpass+Mono:wght@400..600&display=swap">
<style>
  :root {
    --bg:          hsl(97 29% 91%);
    --ink:         hsl(222 54% 19%);
    --muted:       hsl(144 10% 29%);
    --rule:        hsl(104 18% 56%);
    --grid-minor:  hsl(104 28% 50% / .16);
    --grid-major:  hsl(104 30% 36% / .30);
    --accent:      hsl(54 88% 67%);
    --accent-line: hsl(47 55% 45%);
    --l0: hsl(104 18% 56% / .22);
    --l1: hsl(222 54% 19% / .28);
    --l2: hsl(222 54% 19% / .48);
    --l3: hsl(222 54% 19% / .72);
    --l4: hsl(222 54% 19% / .95);
  }
  [data-theme="dark"] {
    --bg:          hsl(210 68% 18%);
    --ink:         hsl(206 50% 95%);
    --muted:       hsl(208 42% 80%);
    --rule:        hsl(207 40% 44%);
    --grid-minor:  hsl(206 60% 90% / .055);
    --grid-major:  hsl(206 60% 90% / .14);
    --accent:      hsl(54 88% 67%);
    --accent-line: hsl(47 48% 54%);
    --l0: hsl(207 40% 44% / .30);
    --l1: hsl(206 50% 95% / .22);
    --l2: hsl(206 50% 95% / .42);
    --l3: hsl(206 50% 95% / .68);
    --l4: hsl(206 50% 95% / .95);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 380px; }

  body {
    font-family: 'Overpass', sans-serif;
    background: var(--bg); color: var(--ink);
    position: relative; overflow: hidden;
    background-image:
      linear-gradient(var(--grid-major) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
      linear-gradient(var(--grid-minor) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
  }

  .frame    { position: absolute; inset: 14px; border: 2px solid var(--rule); }
  .frame-in { position: absolute; inset: 20px; border: 1px solid var(--rule); opacity: .55; }

  .stage { position: absolute; inset: 0; padding: 40px 58px; display: flex; flex-direction: column; }

  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .head .title { font-size: 27px; font-weight: 800; letter-spacing: -.02em; }
  .head .meta {
    font-family: 'Overpass Mono', monospace; font-size: 12.5px; font-weight: 500;
    letter-spacing: .12em; color: var(--accent-line);
  }

  /* dimension callout spanning the plotted year */
  .dim { position: relative; height: 20px; margin-bottom: 8px; }
  .dim .bar  { position: absolute; top: 10px; left: 0; right: 0; height: 1px; background: var(--accent-line); }
  .dim .tick { position: absolute; top: 0; width: 1px; height: 20px; background: var(--accent-line); }
  .dim .tick.l { left: 0; } .dim .tick.r { right: 0; }
  .dim .arrow { position: absolute; top: 6px; width: 0; height: 0;
    border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
  .dim .arrow.l { left: 1px;  border-right: 8px solid var(--accent-line); }
  .dim .arrow.r { right: 1px; border-left:  8px solid var(--accent-line); }
  .dim .label {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    background: var(--bg); padding: 0 12px;
    font-family: 'Overpass Mono', monospace; font-size: 12px; font-weight: 500;
    letter-spacing: .14em; color: var(--accent-line); line-height: 20px;
  }

  .plot { display: flex; gap: 10px; align-items: flex-start; }

  .daylabels {
    display: grid; grid-template-rows: repeat(7, 17px); gap: 3px;
    font-family: 'Overpass Mono', monospace; font-size: 10.5px; color: var(--muted);
    width: 26px; padding-top: 19px;
  }
  .daylabels span { line-height: 17px; }

  .cal { flex: 0 0 auto; }
  .months {
    display: flex; height: 16px; margin-bottom: 3px;
    font-family: 'Overpass Mono', monospace; font-size: 10.5px;
    letter-spacing: .1em; color: var(--muted);
  }
  .months span { flex: 0 0 auto; }

  .weeks { display: flex; gap: 3px; }
  .week  { display: grid; grid-template-rows: repeat(7, 17px); gap: 3px; }
  .day   { width: 17px; height: 17px; background: var(--l0); }
  .day.l1 { background: var(--l1); }
  .day.l2 { background: var(--l2); }
  .day.l3 { background: var(--l3); }
  .day.l4 { background: var(--l4); }
  .day.peak { background: var(--accent); outline: 1.5px solid var(--accent-line); outline-offset: -1.5px; }
  .day.empty { background: transparent; }

  /* title block, same construction as sheet 1 but laid out as a footer strip */
  .foot { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  table.titleblock { border-collapse: collapse; font-size: 14px; }
  table.titleblock td { border: 1px solid var(--rule); padding: 6px 13px; white-space: nowrap; }
  table.titleblock td.k {
    font-family: 'Overpass Mono', monospace; font-size: 11.5px; font-weight: 400;
    letter-spacing: .12em; color: var(--muted);
  }
  table.titleblock td.v { font-weight: 600; font-family: 'Overpass Mono', monospace; font-size: 13px; }

  .legend {
    display: flex; align-items: center; gap: 7px; padding-bottom: 5px;
    font-family: 'Overpass Mono', monospace; font-size: 11px;
    letter-spacing: .1em; color: var(--muted);
  }
  .legend i { width: 13px; height: 13px; display: block; }
</style>
</head>
<body data-theme="light">
  <div class="frame"></div>
  <div class="frame-in"></div>

  <div class="stage">
    <div class="head">
      <div class="title" id="title">Commit activity</div>
      <div class="meta" id="range">&mdash;</div>
    </div>

    <div class="dim" id="dim">
      <span class="bar"></span>
      <span class="tick l"></span><span class="tick r"></span>
      <span class="arrow l"></span><span class="arrow r"></span>
      <span class="label" id="dimlabel">52 weeks</span>
    </div>

    <div class="plot">
      <div class="daylabels">
        <span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span>
      </div>
      <div class="cal">
        <div class="months" id="months"></div>
        <div class="weeks" id="weeks"></div>
      </div>
    </div>

    <div class="foot">
      <table class="titleblock">
        <tr>
          <td class="k">contributions</td><td class="v" id="total">&mdash;</td>
          <td class="k">busiest day</td><td class="v" id="peak">&mdash;</td>
          <td class="k">longest streak</td><td class="v" id="streak">&mdash;</td>
          <td class="k">sheet</td><td class="v">2 of &infin;</td>
        </tr>
      </table>
      <div class="legend">
        <span>less</span>
        <i style="background:var(--l0)"></i><i style="background:var(--l1)"></i>
        <i style="background:var(--l2)"></i><i style="background:var(--l3)"></i>
        <i style="background:var(--l4)"></i>
        <span>more</span>
      </div>
    </div>
  </div>
</body>
</html>
