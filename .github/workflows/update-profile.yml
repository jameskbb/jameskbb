name: Update profile

# Weekly rather than daily on purpose. The banner records the repo's own
# revision and last-drawn date from human commits only, so a run commits only
# when a person changed something or the generated list moved. There is
# deliberately no push trigger: the page does not need to chase every push.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # the banner's "revision" field is a commit count

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Render the banner
        run: node assets/src/render-banner.mjs

      - name: Update generated README regions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # only the generated outputs, never node_modules
          git add README.md assets/banner-light.png assets/banner-dark.png

          if git diff --cached --quiet; then
            # GitHub disables scheduled workflows after 60 days with no repo
            # activity. The banner skips commits with this subject, so a
            # keep-alive here does not redraw anything.
            age=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
            if [ "$age" -lt 50 ]; then
              echo "Nothing changed."
              exit 0
            fi
            git commit --allow-empty -m "Redraw the banner: keep the schedule alive"
          else
            git commit -m "Redraw the banner and refresh the generated sections"
          fi
          git pull --rebase
          git push
